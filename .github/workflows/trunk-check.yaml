name: Trunk Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  trunk:
    name: Trunk Check

    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15

    env:
      DO_NOT_TRACK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.15 # datasource=github-releases depName=jdx/mise

      # The environment of uv sync, with Pyjoyment, for pyright,
      # as tool.pyright of pyproject.toml says.
      - name: Install
        run: uv sync

      - name: Trunk Check
        uses: trunk-io/trunk-action@v2.0.0
        with:
          check-mode: all
