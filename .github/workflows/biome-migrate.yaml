name: Biome Migrate

# Renovate bumps the version of Biome, in package.json and in .trunk/trunk.yaml,
# but cannot run `biome migrate`, so the $schema and the renamed options and
# rules of biome.jsonc stay behind. On its branches the update job below commits
# the migrated biome.jsonc; anywhere else, a biome.jsonc that the Biome of
# package.json would migrate fails the check.
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/biome-migrate.yaml
      - .trunk/trunk.yaml
      - biome.jsonc
      - package-lock.json
      - package.json
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    name: Check biome.jsonc

    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10

    outputs:
      stale: ${{ steps.up_to_date.outputs.stale }}

    env:
      # Only branches of this repository qualify, never a fork's.
      RENOVATE_PR: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/')
        && github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      # A Renovate branch is checked out at its head rather than merged with
      # main, so that the migrated biome.jsonc matches the branch it is
      # committed to.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RENOVATE_PR == 'true' && github.event.pull_request.head.sha || '' }}

      - name: Install Node from mise.lock
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.15 # datasource=github-releases depName=jdx/mise
          install_args: node

      # npm ci checks every package against its integrity in package-lock.json.
      # No script of the packages runs.
      - name: Install the packages
        run: npm ci --ignore-scripts

      - name: Migrate biome.jsonc
        run: npx biome migrate --write

      - name: Check biome.jsonc is up to date
        id: up_to_date
        run: |-
          if git diff --exit-code --stat -- biome.jsonc; then
            echo "biome.jsonc is up to date."
            exit 0
          fi

          if [ "$RENOVATE_PR" = 'true' ]; then
            git diff --binary -- biome.jsonc > biome.patch
            echo "stale=true" | tee -a "$GITHUB_OUTPUT"
            echo "::notice::biome.jsonc is not migrated on a Renovate branch; the update job commits it."
            exit 0
          fi

          echo "::error::biome.jsonc is not migrated to the Biome of package.json. Run \`npx biome migrate --write\` and commit the result." >&2
          exit 1

      - name: Upload the patch
        if: steps.up_to_date.outputs.stale == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: biome-patch
          path: biome.patch
          retention-days: 1

  # Commits the biome.jsonc that the check job migrated onto the Renovate
  # branch, with the token of the workflow. A push with it starts no workflow,
  # so the job starts the checks of the commit itself, as workflow_dispatch is
  # the event that the token can start; this check among them, which fails if
  # biome.jsonc still needs migrating, as it does not commit on such a run. The
  # job runs no code of the packages: it only applies the patch.
  update:
    name: Commit the migrated biome.jsonc

    needs: check
    if: needs.check.outputs.stale == 'true'

    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10

    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download the patch
        uses: actions/download-artifact@v8
        with:
          name: biome-patch

      # The author is in gitIgnoredAuthors of .renovaterc.json, so that
      # Renovate keeps rebasing and updating the branch. The push goes to the
      # commit that the check job migrated biome.jsonc for: if the branch moved
      # meanwhile, the push is rejected, and the run of the newer commit takes
      # over.
      - name: Commit and push to the pull request branch
        env:
          BRANCH: ${{ github.head_ref }}
          MESSAGE: Migrate biome.jsonc to the new version of Biome
        run: |-
          git apply --index biome.patch
          rm biome.patch
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "$MESSAGE"
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Run the checks of the commit
        env:
          BRANCH: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |-
          gh workflow run biome-migrate.yaml --ref "$BRANCH"
          gh workflow run build.yaml --ref "$BRANCH"
          gh workflow run tests.yaml --ref "$BRANCH"
          gh workflow run trunk-check.yaml --ref "$BRANCH"
