name: Docs

# Builds the documentation with Sphinx of the group docs and the environment of
# uv.lock, as Read the Docs does, from the pages of docs, the docstrings of the
# module and the examples that the pages include: a warning of Sphinx, as a
# reference that is not found or a docstring that is not valid
# reStructuredText, fails the build.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/docs.yaml
      - .readthedocs.yaml
      - docs/**
      - examples/**
      - Pyjo/**
      - mise.lock
      - mise.toml
      - pyproject.toml
      - uv.lock
  pull_request:
    branches:
      - "*"
    paths:
      - .github/workflows/docs.yaml
      - .readthedocs.yaml
      - docs/**
      - examples/**
      - Pyjo/**
      - mise.lock
      - mise.toml
      - pyproject.toml
      - uv.lock
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: build

    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.24 # datasource=github-releases depName=jdx/mise

      # --keep-going reports all the warnings, which -W turns into errors.
      - name: Build documentation
        run: |-
          uv run --locked --group docs \
            sphinx-build -W --keep-going -b html docs docs/_build/html
