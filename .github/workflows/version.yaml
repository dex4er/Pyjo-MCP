name: Automated version

# Sets the version of pyproject.toml and uv.lock with uv version and keeps it
# in the pull request of the branch automated/version, whose merge Automated
# tag tags. It works with the token of the workflow, so the job starts the
# checks on the branch with workflow_dispatch, as Automated trunk upgrade does.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: The components of uv version --bump. After a release major, minor, patch, post, or the next
          version with a pre-release, as "patch dev"; after a development version or a pre-release also stable, or
          the same or a later pre-release alone, as rc after alpha; manual takes the version below
        type: choice
        options:
          - patch
          - minor
          - major
          - post
          - stable
          - dev
          - alpha
          - beta
          - rc
          - patch dev
          - minor dev
          - major dev
          - patch alpha
          - minor alpha
          - major alpha
          - patch beta
          - minor beta
          - major beta
          - patch rc
          - minor rc
          - major rc
          - manual
        default: patch
      version:
        description: The version of the bump manual, as "1.0.0"
        required: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  version:
    name: version

    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10

    env:
      BRANCH: automated/version
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.3 # datasource=github-releases depName=jdx/mise

      - name: Set version
        run: |
          set -o pipefail
          args=()
          if [[ ${BUMP} == manual ]]; then
            if [[ -z ${VERSION} ]]; then
              echo "::error::The bump manual needs a version" >&2
              exit 1
            fi
            args=("${VERSION}")
          else
            for bump in ${BUMP}; do
              args+=(--bump "${bump}")
            done
          fi
          uv version --no-sync "${args[@]}" | tee "${RUNNER_TEMP}/pr_body.log"
          uv version --short > "${RUNNER_TEMP}/version.log"
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}

      - name: Commit and push to branch
        run: |
          git diff --exit-code && exit
          git add pyproject.toml uv.lock
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Automated version $(cat "${RUNNER_TEMP}/version.log")"
          git push --force origin "HEAD:refs/heads/${BRANCH}"
          echo "changes=true" >> "${GITHUB_ENV}"

      - name: Create pull request
        if: env.changes == 'true'
        run: |
          gh label create automated --color ededed --force
          title="Automated version $(cat "${RUNNER_TEMP}/version.log")"
          if [[ $(gh pr view "${BRANCH}" --json state --jq .state || true) != "OPEN" ]]; then
            gh pr create \
              --base main \
              --head "${BRANCH}" \
              --title "${title}" \
              --body-file "${RUNNER_TEMP}/pr_body.log" \
              --label automated
          else
            gh pr edit "${BRANCH}" \
              --title "${title}" \
              --body-file "${RUNNER_TEMP}/pr_body.log"
          fi

      - name: Run the checks of the commit
        if: env.changes == 'true'
        run: |-
          gh workflow run build.yaml --ref "${BRANCH}"
          gh workflow run tests.yaml --ref "${BRANCH}"
          gh workflow run trunk-check.yaml --ref "${BRANCH}"
