name: Automated tag

# Tags the merge commit of the pull request of Automated version with the
# version of its pyproject.toml, when it is merged or with a comment /tag of a
# maintainer on it, and starts Release on the tag with workflow_dispatch, as a
# tag of the token of the workflow starts no workflow. A development version is
# not tagged.
on:
  issue_comment:
    types:
      - created
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  actions: write
  contents: write
  pull-requests: read

jobs:
  tag:
    name: tag

    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10

    if: (github.event.issue.pull_request && startsWith(github.event.issue.title, 'Automated version')
      && github.event.comment.body == '/tag' && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
      github.event.comment.author_association)) || (startsWith(github.event.pull_request.title, 'Automated
      version') && github.event.pull_request.merged)

    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Create tag
        run: |
          sha=$(gh pr view "${NUMBER}" --json mergeCommit --jq .mergeCommit.oid)
          test -n "${sha}"
          version=$(gh api "repos/${GH_REPO}/contents/pyproject.toml?ref=${sha}" --jq .content | base64 -d |
            python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["project"]["version"])')
          if ! [[ ${version} =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?(\.post[0-9]+)?$ ]]; then
            echo "Version ${version} is not a release"
            exit
          fi
          gh api "repos/${GH_REPO}/git/refs" -f ref="refs/tags/${version}" -f sha="${sha}"
          gh workflow run release.yaml --ref "${version}"
        env:
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
