name: Release

# Makes the draft of the GitHub release of a tag, pushed or created by
# Automated tag, which starts it with workflow_dispatch, as a tag of the token
# of a workflow starts no workflow. Its notes are written before it is
# published, and PyPI publishes its files after it.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: build

    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10

    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.25 # datasource=github-releases depName=jdx/mise

      - name: Check the version
        run: |
          uv lock --check
          test "${GITHUB_REF_TYPE}" = tag
          test "${GITHUB_REF_NAME}" = "$(uv version --short)"

      - name: Build sdist and wheel
        run: uv build

      - name: Set up Syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0

      # What an installation of the wheel gets: the distribution and its
      # dependencies at the versions of uv.lock, without its dependency groups,
      # which syft would take from uv.lock itself, installed in a virtual
      # environment of their own.
      - name: Create SBOM
        run: |
          uv export --frozen --no-default-groups --no-emit-project --no-hashes -o "${RUNNER_TEMP}/requirements.txt"
          uv venv "${RUNNER_TEMP}/sbom"
          uv pip install --python "${RUNNER_TEMP}/sbom/bin/python" -r "${RUNNER_TEMP}/requirements.txt"
          uv pip install --python "${RUNNER_TEMP}/sbom/bin/python" --no-deps dist/*.whl
          "${SYFT}" scan "dir:${RUNNER_TEMP}/sbom" \
            --override-default-catalogers python-installed-package-cataloger \
            --source-name pyjo-mcp \
            --source-version "${GITHUB_REF_NAME}" \
            --output "spdx-json=pyjo-mcp-${GITHUB_REF_NAME}.spdx.json"
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |-
            dist/*
            pyjo-mcp-*.spdx.json

      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/*
          sbom-path: pyjo-mcp-${{ github.ref_name }}.spdx.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |-
            dist/
            pyjo-mcp-*.spdx.json
          if-no-files-found: error

  release:
    name: release

    needs: build

    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release

      - name: Create draft release
        run: |
          prerelease=()
          if [[ ${GITHUB_REF_NAME} =~ (a|b|rc)[0-9]+$ ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* pyjo-mcp-*.spdx.json \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            "${prerelease[@]}"
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
