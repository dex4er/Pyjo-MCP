name: Mise Lock Check

on:
  pull_request:
    branches:
      - main
    paths:
      - mise.lock
      - mise.toml

permissions:
  contents: read

jobs:
  check:
    name: Check mise.lock

    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # mise-action adds --locked on its own when a lockfile is present, so
      # this downloads every tool and verifies it against the recorded
      # checksums. It covers the runner platform only; the check below covers
      # the rest. It also puts the pinned Python on PATH for that check.
      - name: Install tools from mise.lock
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.24 # datasource=github-releases depName=jdx/mise

      # Lock file maintenance PRs are automerged and nobody reads their diff,
      # so the one thing a human could have spotted there is checked here: a
      # checksum that changed while its URL did not, which means the artifact
      # behind an already pinned URL was replaced. The comparison is keyed on
      # tool + version + platform + URL, so adding a platform, relocking after a
      # version bump, or a new build of the same version under a new URL, as
      # python-build-standalone publishes, is not flagged.
      - name: Check for replaced artifacts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |-
          set -eo pipefail

          if ! git show "$BASE_SHA:mise.lock" > base.lock 2> /dev/null; then
            echo "No mise.lock on the base commit, nothing to compare."
            exit 0
          fi

          python - base.lock mise.lock << 'EOF'
          import sys, tomllib

          def flatten(path):
              with open(path, "rb") as f:
                  lock = tomllib.load(f)
              return {
                  (tool, entry["version"], key.removeprefix("platforms."), value.get("url")): value.get("checksum")
                  for tool, entries in lock.get("tools", {}).items()
                  for entry in entries
                  for key, value in entry.items()
                  if key.startswith("platforms.")
              }

          base, head = flatten(sys.argv[1]), flatten(sys.argv[2])
          replaced = [(k, base[k], v) for k, v in head.items() if k in base and base[k] != v]

          for (tool, version, platform, url), was, now in replaced:
              print(f"  {tool} {version} ({platform})\n    url: {url}\n    was: {was}\n    now: {now}")

          if replaced:
              sys.exit("Checksum changed without a URL change - the artifact behind a pinned URL was replaced.")

          print("No checksum changed for an unchanged URL.")
          EOF
